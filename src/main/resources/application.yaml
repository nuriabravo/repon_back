spring:
  application:
    name: repon
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/repon}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

app:
  auth:
    username: ${APP_USERNAME:test}
    password-hash: ${APP_PASSWORD_HASH:test}

jwt:
  secret: ${JWT_SECRET:test}
  expiration-days: 30
